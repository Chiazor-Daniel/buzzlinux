name: SSH Access to GitHub Runner

on:
  workflow_dispatch:
    description: >
      Start SSH access to this GitHub-hosted Ubuntu runner.
      Sets up SSH server and provides connection credentials.
    inputs:
      tunnel-duration-minutes:
        description: "Keep tunnel alive for this many minutes (max 1440)"
        default: "60"
        required: false

jobs:
  setup-ssh:
    runs-on: ubuntu-latest
    timeout-minutes: 1440
    defaults:
      run:
        shell: bash

    steps:
      - name: Install openssh-server and jq
        run: |
          sudo apt-get update -y
          sudo apt-get install -y openssh-server jq

      - name: Create privilege separation directories
        run: |
          # Create both possible privilege separation dirs
          sudo mkdir -p /run/sshd
          sudo mkdir -p /var/run/sshd
          sudo mkdir -p /var/empty/sshd

      - name: Start SSH server (Robust method)
        run: |
          # Method 1: Standard start
          sudo /usr/sbin/sshd || true
          sleep 1
          
          # Method 2: Check if running, if not try with -D flag
          if ! pgrep -x sshd > /dev/null; then
            echo "sshd not running with standard method, trying fallback..."
            sudo /usr/sbin/sshd -D &
            sleep 3
          fi
          
          # Method 3: Final check and force start
          if ! pgrep -x sshd > /dev/null; then
            echo "Attempting forceful sshd start..."
            # Kill any existing sshd
            sudo pkill -9 sshd 2>/dev/null || true
            sleep 1
            # Start sshd in foreground/background
            sudo /usr/sbin/sshd -D &
            sleep 3
          fi
          
          # Verify sshd is running
          if pgrep -x sshd > /dev/null; then
            echo "✅ sshd is running"
          else
            echo "⚠️  sshd could not start - checking logs"
            cat /var/log/auth.log 2>/dev/null | tail -20 || echo "No auth.log available"
          fi

      - name: Create temporary SSH user
        run: |
          sudo useradd -m -s /bin/bash tmpuser
          # Set temporary password
          echo "tmpuser:RunnerTunnel2024!" | sudo chpasswd
          # Ensure user can SSH in
          echo "tmpuser ALL=(ALL) ALL" | sudo tee /etc/sudoers.d/tmpuser
          # Unlock the account
          sudo passwd -u tmpuser
          echo "✅ Temporary SSH user 'tmpuser' created"

      - name: Get runner network information
        run: |
          IP_ADDR=$(hostname -I | awk '{print $1}')
          echo "Runner IP: $IP_ADDR"
          echo "RUNNER_IP::$IP_ADDR" >> "$GITHUB_ENV"
          echo "OS: Ubuntu 24.04.4 LTS"
          echo "OS::Ubuntu 24.04.4 LTS" >> "$GITHUB_ENV"
          echo "CPU cores: $(nproc)"
          echo "CPU cores::$(nproc)" >> "$GITHUB_ENV"
          echo "Total memory: $(free -m | grep Mem | awk '{print $2}') MB"
          echo "Total memory::$(free -m | grep Mem | awk '{print $2}') MB" >> "$GITHUB_ENV"

      - name: Display SSH connection information
        run: |
          echo ""
          echo "========================================="
          echo "  SSH CONNECTION INFORMATION"
          echo "========================================="
          echo "Runner: GitHub-hosted Ubuntu (ephemeral)"
          echo "Username: tmpuser"
          echo ""
          if [ -n "${RUNNER_IP:-}" ]; then
            echo "  Runner Internal IP: ${RUNNER_IP}"
            echo ""
            echo "  SSH COMMAND TO RUN:"
            echo "  ssh -o StrictHostKeyChecking=no tmpuser@${RUNNER_IP}"
            echo ""
            echo "  PASSWORD: RunnerTunnel2024!"
            echo ""
            echo "  Note: This connects to GitHub's internal network."
            echo "  If connection fails, try re-running the workflow."
            echo "  ⚠️  This runner is TEMPORARY - terminates when"
            echo "  workflow is cancelled"
          else
            echo "  Unable to determine runner IP."
            echo "  Try: ssh -o StrictHostKeyChecking=no tmpuser@localhost"
          fi
          echo ""
          echo "  ⚠️  This runner is TEMPORARY"
          echo "  ⚠️  Workflow can be cancelled anytime"
          echo "  ⚠️  SSH access ends when workflow cancels"
          echo "========================================="
          echo ""
          echo "  To cancel this workflow:"
          echo "  1. Go to GitHub → Actions tab"
          echo "  2. Click 'SSH Access to GitHub Runner'"
          echo "  3. Click 'Cancel workflow'"
          echo ""

      - name: Keep workflow and SSH alive
        run: |
          # Loop to keep the workflow running and maintain SSH
          timeout_counter=0
          max_timeouts=12  # Check every cycle for 12 cycles = 720 seconds (12 minutes)
          
          while [ $timeout_counter -lt $max_timeouts ]; do
            # Check and restart sshd if needed
            if ! pgrep -x sshd > /dev/null 2>&1; then
              echo "[$(date)] sshd not running, restarting..."
              sudo mkdir -p /run/sshd /var/run/sshd
              sudo /usr/sbin/sshd -D &
              sleep 3
            fi
            
            # Print status every 3 cycles
            if [ $((timeout_counter % 3)) -eq 0 ]; then
              echo "[$(date)] Workflow running... $(($timeout_counter + 1))/$(max_timeouts) cycles elapsed ($((timeout_counter + 1)) minutes)"
            fi
            
            timeout_counter=$((timeout_counter + 1))
            sleep 60  # Check every minute
          done
          echo "Keep-alive loop complete after $((max_timeouts * 60)) seconds"
