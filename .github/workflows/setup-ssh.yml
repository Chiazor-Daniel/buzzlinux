name: SSH Setup for Local Connection

on:
  workflow_dispatch:
    description: "Manually trigger SSH setup for local PC connection"
  schedule:
    # Run every 24 hours to keep SSH fresh
    - cron: '0 3 * * *'

jobs:
  configure-ssh:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate SSH Key if Not Present
        id: generate-key
        run: |
          if [ -f ~/.ssh/codespaces.auto ]; then
            echo "Existing key found"
            echo "key_exists=true" >> $GITHUB_OUTPUT
          else
            echo "Generating new SSH key..."
            ssh-keygen -t ed25519 -C "github-actions-local" -f ~/.ssh/codespaces.auto -N ""
            echo "key_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Display Public Key
        run: |
          if [ "${{ steps.generate-key.outputs.key_exists }}" = "false" ]; then
            echo "=== NEW SSH PUBLIC KEY ==="
            cat ~/.ssh/codespaces.auto.pub
            echo ""
            echo "ADD THIS KEY TO GITHUB:"
            echo "1. Go to: github.com/settings/keys"
            echo "2. Click 'New SSH key'"
            echo "3. Paste the key above"
            echo "4. Title: 'buzzlinux-actions'"
          else
            echo "Key already exists, skipping..."
          fi

      - name: Start SSH Agent and Add Key
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ~/.ssh/codespaces.auto

      - name: Test SSH Connection to GitHub
        run: |
          ssh -T -o BatchMode=yes -o StrictHostKeyChecking=no git@github.com
          echo "✅ SSH to GitHub successful!"

      - name: Display Connection Instructions
        run: |
          echo ""
          echo "========================================="
          echo "SSH SETUP COMPLETE"
          echo "========================================="
          echo ""
          echo "Your local PC IP (from earlier): 192.168.1.235"
          echo "SSH command from GitHub Actions runner:"
          echo "  ssh -o StrictHostKeyChecking=no buzz@YOUR_PUBLIC_IP"
          echo ""
          echo "Or use this workflow's output to connect:"
          echo "  ssh -i ~/.ssh/codespaces.auto buzz@your_public_ip"
          echo ""
          echo "To use in other workflows, add this step:"
          echo ""
          echo "  - uses: webfactory/ssh-agent@v0.8.0"
          echo "    with:"
          echo "      ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY || ~/.ssh/codespaces.auto }}"
          echo "========================================="
