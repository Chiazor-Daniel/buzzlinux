name: Web App with Tunnel

on:
  workflow_dispatch:

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    defaults:
      run:
        shell: bash

    steps:
      - name: Show runner info
        run: |
          echo "Runner: $(hostname)"
          echo "OS: Ubuntu 24.04.4 LTS"
          echo "IP: $(hostname -I | awk '{print $1}')"

      - name: Start simple web app
        run: |
          nohup python3 runner-web/app.py > /tmp/web.log 2>&1 &
          echo "Web app PID: $!"
          sleep 2
          curl -s http://localhost:8080 | head -5

      - name: Try Cloudflare Tunnel (cloudflared)
        run: |
          echo "Attempting cloudflared tunnel..."

          curl -sL "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.tgz" -o /tmp/cloudflared.tgz || true

          if [ -f /tmp/cloudflared.tgz ] && [ -s /tmp/cloudflared.tgz ]; then
            echo "Downloaded cloudflared binary"
            tar -xzf /tmp/cloudflared.tgz -C /tmp cloudflared 2>/dev/null && cp /tmp/cloudflared /usr/local/bin/cloudflared && chmod +x /usr/local/bin/cloudflared && echo "extracted to /usr/local/bin"
          else
            echo "cloudflared download failed, trying npm localtunnel..."
            npm install -g localtunnel 2>/dev/null || true
          fi

          if command -v cloudflared >/dev/null 2>&1; then
            echo "Starting cloudflared tunnel..."
            nohup cloudflared tunnel --url http://localhost:8080 > /tmp/tunnel.log 2>&1 &
            sleep 10
            TUNNEL_URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/tunnel.log | head -1)
            if [ -n "$TUNNEL_URL" ]; then
              echo "TUNNEL_URL::$TUNNEL_URL" >> $GITHUB_ENV
              echo "Cloudflare Tunnel: $TUNNEL_URL"
            else
              echo "cloudflared started but URL not found"
              tail -20 /tmp/tunnel.log
            fi
          elif command -v lt >/dev/null 2>&1; then
            echo "Starting localtunnel..."
            nohup lt --port 8080 > /tmp/tunnel.log 2>&1 &
            sleep 10
            TUNNEL_URL=$(grep -oE 'https://[a-z0-9-]+\.loca\.lt' /tmp/tunnel.log | head -1)
            if [ -n "$TUNNEL_URL" ]; then
              echo "TUNNEL_URL::$TUNNEL_URL" >> $GITHUB_ENV
              echo "Localtunnel: $TUNNEL_URL"
            else
              echo "localtunnel started but URL not found"
              tail -20 /tmp/tunnel.log
            fi
          else
            echo "TUNNEL_URL::" >> $GITHUB_ENV
            echo "No tunneling method available"
          fi

      - name: Display access information
        run: |
          echo ""
          echo "========================================="
          echo "  WEB APP ACCESS INFORMATION"
          echo "========================================="
          echo ""
          echo "  Local: http://localhost:8080"
          echo ""
          if [ -n "${TUNNEL_URL:-}" ]; then
            echo "  Public Tunnel: $TUNNEL_URL"
            echo ""
            echo "  Open in browser: $TUNNEL_URL"
          else
            echo "  No public tunnel established."
            echo "  Web app runs locally on the runner."
          fi
          echo ""
          echo "========================================="
          echo ""
          echo "  Workflow stays alive up to 6 hours."
          echo "  Cancel from GitHub Actions tab."
          echo ""

      - name: Keep running
        run: |
          echo "Keeping runner alive..."
          while true; do
            if ! pgrep -f "python3 runner-web/app.py" >/dev/null 2>&1; then
              echo "Web app stopped, restarting..."
              nohup python3 runner-web/app.py > /tmp/web.log 2>&1 &
            fi
            sleep 30
          done
