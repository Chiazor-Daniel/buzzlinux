name: Always-On Web Service (Fixed)

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 1440  # 24 hours max
    steps:
      - name: Start web app
        run: |
          nohup python3 -m http.server 8080 > /tmp/web.log 2>&1 &
          echo "Web app PID: $!"
          sleep 2
          curl -s http://localhost:8080 | head -1

      - name: Create localtunnel
        run: |
          npm install -g localtunnel 2>/dev/null || true
          if command -v lt >/dev/null 2>&1; then
            nohup lt --port 8080 > /tmp/tunnel.log 2>&1 &
            sleep 5
            TUN=$(grep -oE 'https://[a-z0-9-]+\.loca\.lt' /tmp/tunnel.log | head -1)
            if [ -n "$TUN" ]; then
              # FIX: Use proper GITHUB_ENV format (key=value, NOT key::value)
              echo "TUNNEL_URL=$TUN" >> "$GITHUB_ENV"
              echo "Tunnel URL: $TUN"
            else
              echo "⚠️  Tunnel started but URL not captured"
              cat /tmp/tunnel.log
            fi
          else
            echo "❌ localtunnel not available"
          fi

      - name: Display access info
        run: |
          echo "========================================"
          echo "  🌐 WEB SERVICE ACCESS INFO"
          echo "========================================"
          echo "  Local:    http://localhost:8080"
          if [ -n "${TUNNEL_URL:-}" ]; then
            echo "  Public:   $TUNNEL_URL"
            echo "  🌍 Browser: $TUNNEL_URL"
          else
            echo "  ⚠️  No tunnel URL generated"
          fi
          echo ""
          echo "  ⏰ Workflow runs for up to 1440 minutes (24 hours)"
          echo "  ⏰ Re-run for a fresh tunnel URL"
          echo ""

      - name: Keep alive for full duration
        # This loop keeps the workflow running and maintains the tunnel
        # It runs within the 1440-minute timeout
        run: |
          echo "⏱  Starting keep-alive loop (max 1440 minutes = 24 hours)"
          COUNT=0
          while [ $COUNT -lt 1440 ]; do
            # Restart web app if it stopped
            if ! pgrep -f "python3 -m http.server 8080" >/dev/null 2>&1; then
              echo "[$(date)] 🔄 Web app restarted at minute $COUNT"
              nohup python3 -m http.server 8080 > /tmp/web2.log 2>&1 &
            fi
            
            # Quick tunnel health check
            if [ -n "${TUNNEL_URL:-}" ]; then
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$TUNNEL_URL" 2>/dev/null)
              echo "[$(date)] 🔍 Tunnel health: HTTP $HTTP_CODE (min $COUNT)"
            fi
            
            # Status update every 60 minutes
            if [ $((COUNT % 60)) -eq 0 ]; then
              HOURS=$((COUNT / 60))
              MINS=$((COUNT % 60))
              echo "[$(date)] ⏱  Running ${HOURS}h ${MINS}m of 24h..."
            fi
            
            COUNT=$((COUNT + 1))
            sleep 30  # 30 seconds real time per iteration
          done
          
          echo "✅ 24-hour period complete - workflow ending"
